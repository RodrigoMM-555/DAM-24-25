<!doctype html>
<html>
    <head>	
        
    </head>
    <body>
        <canvas></canvas>
        <script>
            // Condiciones iniciales
            let temporizador = setTimeout("bucle()",1000);
            let lienzo = document.querySelector("canvas");
            lienzo.width = 512;
            lienzo.height = 512;
            let contexto = lienzo.getContext("2d");	
            
            // Condicion de bucle
            function bucle(){
                let fecha = new Date();
                let hora = fecha.getHours();
                let minuto = fecha.getMinutes();
                let segundo = fecha.getSeconds();

                //Cada segundo se borra y crea un nuevo circulo
                contexto.clearRect(0,0,512,512)

                // Ahora voy a dibujar un circulo
                contexto.beginPath();
                contexto.arc(256,256,200,0,Math.PI*2);
                contexto.stroke();

                //Maneciila de segundos
                angulo_segundo = segundo*(Math.PI*2)/60
                contexto.beginPath();
                contexto.moveTo(256,256);
                contexto.lineTo(
                    256+Math.cos(angulo_segundo)*200,
                    256+Math.sin(angulo_segundo)*200);
                contexto.stroke();

                // Ahora dibujo la manecilla de los minutos
                angulo_minuto = minuto*(Math.PI*2/60)
                contexto.beginPath(); 
                contexto.moveTo(256,256);
                contexto.lineTo(
                256+Math.cos(angulo_minuto)*150,
                256+Math.sin(angulo_minuto)*150);
                contexto.stroke();

                // Ahora dibujo la manecilla de las horas
                angulo_hora = hora*(Math.PI*2/60)
                contexto.beginPath(); 
                contexto.moveTo(256,256);
                contexto.lineTo(
                256+Math.cos(angulo_hora)*100,
                256+Math.sin(angulo_hora)*100);
                contexto.stroke();

                clearTimeout(temporizador);
                temporizador = setTimeout("bucle()",1000);
            }

        </script>
    </body>
</html>
