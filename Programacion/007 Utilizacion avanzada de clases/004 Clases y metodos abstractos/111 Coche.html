<!doctype html>
<html>
    <head>
        <style>
            #azul{
                width:50px;height:50px;background:blue;border:1px solid black;
            }
        </style>
    </head>
    <body>
        <script>
            let posx = 0;
            let posy = 0;
            let a = 0; // en grados

            document.onkeypress = function(tecla){
                let rad = a * Math.PI / 180; // convertir a radianes

                switch(tecla.key){
                    case "w":
                        console.log("Movemos el personaje hacia arriba");
                        posy -= 10 * Math.cos(rad);
                        posx += 10 * Math.sin(rad);
                        break;
                    case "a": // girar izquierda
                        a -= 15;
                        break;
                    case "d": // girar derecha
                        a += 15;
                        break;
                }

                document.querySelector("#azul").style.transform =
                    "translate("+posx+"px,"+posy+"px) rotate("+a+"deg)";
            }
        </script>
        <div id="azul"></div>
    </body>
</html>
