<!doctype html>
<html>
    <head>
        <style>
            #rojo{
                width:50px;height:50px;background:red;border:1px solid black;
                
                /*Movera el item 200px en x e y respectivamente*/
                transform: translate(200px,200px);
                /*Se puede hacer por separado*/
                transform: translateX(200px) translateY(200px);
            }
        </style>
    </head>
    <body>
        <div id="rojo"></div>
    </body>
</html>
