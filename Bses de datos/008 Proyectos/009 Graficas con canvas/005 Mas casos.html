<html>
    <head>
        <style>
            canvas {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script>
            let lienzo = document.querySelector("canvas");
            let contexto = lienzo.getContext("2d");
            lienzo.width = 400;
            lienzo.height = 400;

            // Cacho 1
            contexto.fillStyle = "red";
            contexto.beginPath();
            contexto.moveTo(128,128);
            contexto.arc(128, 128, 100, 0, 2 * Math.PI * 0.3);
            contexto.lineTo(128,128)
            contexto.fill();

            // Cacho 2
            contexto.fillStyle = "blue";
            contexto.beginPath();
            contexto.moveTo(128,128);
            contexto.arc(128, 128, 100, 2 * Math.PI * 0.3, 2 * Math.PI * 0.6);
            contexto.lineTo(128,128);
            contexto.fill();

            // Cacho 3
            contexto.fillStyle = "green";
            contexto.beginPath();
            contexto.moveTo(128,128);
            contexto.arc(128, 128, 100, 2 * Math.PI * 0.6, 2 * Math.PI * 0.9);
            contexto.lineTo(128,128);
            contexto.fill();

            // Cacho 4
            contexto.fillStyle = "yellow";
            contexto.beginPath();
            contexto.moveTo(128,128);
            contexto.arc(128, 128, 100, 2 * Math.PI * 0.9, 2 * Math.PI);
            contexto.lineTo(128,128);
            contexto.fill();
        </script>
    </body>
</html>
