<html>
    <head>
        <style>
            canvas {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <script>
            let lienzo = document.querySelector("canvas");
            let contexto = lienzo.getContext("2d");
            lienzo.width = 400;
            lienzo.height = 400;

            contexto.beginPath();
            contexto.arc(128, 128, 100, 0, 2 * Math.PI);
            contexto.fill();
        </script>
    </body>
</html>
